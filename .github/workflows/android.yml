name: Android CI/CD (Build APK)

on:
  push:
    branches: [ "main" ] # Jab bhi main branch par code push hoga, yeh run karega
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      working-directory: Memekeybord
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: Memekeybord
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Desi-Meme-Keyboard-APK
        path: Memekeybord/app/build/outputs/apk/debug/app-debug.apk
